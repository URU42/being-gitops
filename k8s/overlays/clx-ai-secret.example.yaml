# 실제 값은 커밋하지 않는다. kustomization.yaml 의 resources 에도 넣지 않는다. 만들 때:
#   kubectl -n u4-2 create secret generic clx-ai --from-literal=openai-api-key='<OpenAI API 키>'
# 키를 바꾸면 clx-ai 파드를 다시 시작해야 반영된다 (kubectl -n u4-2 rollout restart deploy/clx-ai).
# 키가 없으면 clx-ai 는 정상 기동하고 알람 요약만 503 LLM_NOT_CONFIGURED 를 돌려준다. backend 는 RETRY 로 남겨 다시 시도한다.
# 파드에서 api.openai.com(443)으로 나가는 연결이 허용되어야 한다.
apiVersion: v1
kind: Secret
metadata:
    name: clx-ai
type: Opaque
stringData:
    openai-api-key: ""
