# 실제 값은 커밋하지 않는다. kustomization.yaml 의 resources 에도 넣지 않는다. 만들 때:
#   kubectl -n u4-2 create secret generic clx-ai \
#     --from-literal=openai-api-key='<OpenAI API 키>' \
#     --from-literal=agent-internal-token="$(openssl rand -hex 32)" \
#     --dry-run=client -o yaml | kubectl apply -f -
# 이미 있는 Secret 에 키 하나만 추가할 때 (다른 키는 그대로 둔다):
#   kubectl -n u4-2 patch secret clx-ai --type merge -p "{\"stringData\":{\"agent-internal-token\":\"$(openssl rand -hex 32)\"}}"
# 키를 바꾸면 clx-ai 파드를 다시 시작해야 반영된다 (kubectl -n u4-2 rollout restart deploy/clx-ai).
# 키가 없으면 clx-ai 는 정상 기동하고 알람 요약만 503 LLM_NOT_CONFIGURED 를 돌려준다. backend 는 RETRY 로 남겨 다시 시도한다.
# agent-internal-token 이 없으면 에이전트 API 만 AGENT_NOT_CONFIGURED 를 돌려준다. backend 가 X-Agent-Token 으로 같은 값을 보내야 한다.
# ai-service-token 은 선택이다. 넣으면 guide API 가 X-Service-Token 을 요구하므로 backend 가 헤더를 보낸 뒤에 추가한다.
# 파드에서 api.openai.com(443)으로 나가는 연결이 허용되어야 한다.
apiVersion: v1
kind: Secret
metadata:
    name: clx-ai
type: Opaque
stringData:
    openai-api-key: ""
    agent-internal-token: ""
    ai-service-token: ""
