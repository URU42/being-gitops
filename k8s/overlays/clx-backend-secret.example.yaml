# 실제 값은 커밋하지 않는다. kustomization.yaml 의 resources 에도 넣지 않는다. 만들 때:
#   kubectl -n u4-2 create secret generic clx-backend \
#     --from-literal=auth-jwt-secret='<UTF-8 32바이트 이상의 임의 문자열>' \
#     --from-literal=admin-username='<3~50자 영문·숫자·._->' \
#     --from-literal=admin-password='<10자 이상 72바이트 이하>'
# admin-* 는 최초 관리자 생성 뒤 지워도 된다. auth-jwt-secret 은 바꾸면 기존 Access 토큰이 무효가 된다.
apiVersion: v1
kind: Secret
metadata:
    name: clx-backend
type: Opaque
stringData:
    auth-jwt-secret: ""
    admin-username: ""
    admin-password: ""
