# sk-clx-diag-agent Backend. 인증·센서 DB 는 RDS u4_2 의 clx 스키마(PostgreSQL). 세션·보고서 파일 저장소가 PVC(RWO) 에 있으므로 replicas 1, Recreate.
apiVersion: apps/v1
kind: Deployment
metadata:
    name: clx-backend
    labels: { app: clx-backend }
spec:
    replicas: 1
    revisionHistoryLimit: 2
    strategy: { type: Recreate }
    selector:
        matchLabels: { app: clx-backend }
    template:
        metadata:
            labels: { app: clx-backend }
        spec:
            automountServiceAccountToken: false
            imagePullSecrets:
                - name: uru42-harbor-pull
            securityContext:
                runAsNonRoot: true
                runAsUser: 1000 # 이미지의 appuser
                runAsGroup: 1000
                fsGroup: 1000 # PVC 에 쓰기 위해
            containers:
                - name: backend
                  image: harbor.uru42.space/uru42/clx-backend:latest # 태그는 kustomization.yaml 의 images 로 바꾼다 (Jenkins)
                  ports:
                      - { name: http, containerPort: 8080 }
                  env:
                      - name: AUTH_JWT_SECRET # 필수. 없으면 시작을 거절한다
                        valueFrom:
                            secretKeyRef: { name: clx-backend, key: auth-jwt-secret }
                      - name: AUTH_ADMIN_USERNAME # 최초 관리자 생성용. 생성 뒤에는 Secret 에서 지워도 된다
                        valueFrom:
                            secretKeyRef: { name: clx-backend, key: admin-username, optional: true }
                      - name: AUTH_ADMIN_PASSWORD
                        valueFrom:
                            secretKeyRef: { name: clx-backend, key: admin-password, optional: true }
                      - { name: AUTH_COOKIE_SECURE, value: "true" }
                      # 인증·센서 기본 DB: 제공된 rds-credentials 에서 키만 골라 DB_* 로 넣는다(H2 자료는 옮기지 않는다, ADR 0019).
                      # 공유 DB(u4_2)라 다른 서비스의 public Flyway 이력과 섞이지 않게 clx 스키마를 쓴다. 스키마는 Flyway 가 만든다.
                      - name: DB_URL
                        valueFrom:
                            secretKeyRef: { name: rds-credentials, key: SPRING_DATASOURCE_URL }
                      - name: DB_USERNAME
                        valueFrom:
                            secretKeyRef: { name: rds-credentials, key: SPRING_DATASOURCE_USERNAME }
                      - name: DB_PASSWORD
                        valueFrom:
                            secretKeyRef: { name: rds-credentials, key: SPRING_DATASOURCE_PASSWORD }
                      - { name: SPRING_DATASOURCE_HIKARI_SCHEMA, value: clx } # 연결 search_path. native SQL 도 clx 를 쓴다
                      - { name: SPRING_FLYWAY_SCHEMAS, value: clx } # Flyway 이력·테이블을 clx 에 둔다
                      - { name: SPRING_JPA_PROPERTIES_HIBERNATE_DEFAULT_SCHEMA, value: clx }
                      - { name: H2_CONSOLE_ENABLED, value: "false" }
                      - { name: MONITORING_ENABLED, value: "true" }
                      - { name: SENSOR_DATA_IMPORT_ENABLED, value: "false" }
                      - { name: AI_MODE, value: http }
                      - { name: AI_BASE_URL, value: "http://clx-ai:8000" }
                      - { name: JAVA_TOOL_OPTIONS, value: "-Xms128m -Xmx1024m" } # compose 와 같은 힙. limits.memory 는 힙보다 여유 있게
                      # Alarm Worker: Redis Stream plant-sim:alarms → PostgreSQL(alarm 스키마). consumer 이름은 HOSTNAME(파드 이름)을 자동으로 쓴다
                      - { name: ALARM_WORKER_ENABLED, value: "true" }
                      - { name: REDIS_HOST, value: clx-redis } # plant-sim 과 같은 Redis
                      - { name: REDIS_PORT, value: "6379" }
                      # 제공된 rds-credentials Secret 에서 필요한 키만 골라 ALARM_DB_* 로 넣는다.
                      # envFrom 으로 통째로 넣지 않는다: SPRING_DATASOURCE_URL/USERNAME/PASSWORD 가 위 DB_* 설정(spring.datasource.*)과 겹친다.
                      # optional: Secret 이나 키가 없어도 파드는 뜬다. Worker 만 DB 연결을 재시도한다
                      - name: ALARM_DB_URL
                        valueFrom:
                            secretKeyRef: { name: rds-credentials, key: SPRING_DATASOURCE_URL, optional: true }
                      - name: ALARM_DB_USERNAME
                        valueFrom:
                            secretKeyRef: { name: rds-credentials, key: SPRING_DATASOURCE_USERNAME, optional: true }
                      - name: ALARM_DB_PASSWORD
                        valueFrom:
                            secretKeyRef: { name: rds-credentials, key: SPRING_DATASOURCE_PASSWORD, optional: true }
                  resources: # u4-2 team-quota(limits cpu 2)를 다른 서비스와 나눠 쓴다. 롤링 업데이트 여유분까지 남겨 둔다
                      requests: { cpu: 200m, memory: 768Mi }
                      limits: { cpu: 700m, memory: 1536Mi }
                  securityContext:
                      allowPrivilegeEscalation: false
                      readOnlyRootFilesystem: true
                      capabilities: { drop: [ALL] }
                  startupProbe: # Spring 기동 대기, 최대 3분
                      httpGet: { path: /api/v1/health, port: http }
                      periodSeconds: 5
                      failureThreshold: 36
                  readinessProbe:
                      httpGet: { path: /api/v1/health, port: http }
                      periodSeconds: 10
                  livenessProbe:
                      httpGet: { path: /api/v1/health, port: http }
                      periodSeconds: 30
                      failureThreshold: 3
                  volumeMounts:
                      - { name: data, mountPath: /app/.backend-data }
                      - { name: tmp, mountPath: /tmp }
            volumes:
                - name: data
                  persistentVolumeClaim: { claimName: clx-backend-data }
                - name: tmp
                  emptyDir: {}
