# sk-clx-diag-agent infra/nginx/default.conf 와 같은 내용. proxy_pass 대상만 Backend Service 이름(clx-backend)으로 바꿨다.
# 원본이 바뀌면 여기도 같이 바꾼다.
apiVersion: v1
kind: ConfigMap
metadata:
  name: clx-frontend-nginx
data:
  default.conf: |
    server {
      listen 80;
      server_name _;
      root /usr/share/nginx/html;
      index index.html;
      client_max_body_size 5m;

      location /api/ {
        proxy_pass http://clx-backend:8080;
        proxy_connect_timeout 3s;
        proxy_read_timeout 30s;
        proxy_set_header X-Request-ID $http_x_request_id;
      }

      location / {
        try_files $uri $uri/ /index.html;
      }
    }
