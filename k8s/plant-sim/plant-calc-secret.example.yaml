# 실제 값은 커밋하지 않는다. kustomization.yaml 의 resources 에도 넣지 않는다.
# plant-calc(CALC_TOKEN)와 clx-backend(SIM_CALC_TOKEN)가 이 Secret 의 같은 키를 읽는다. 매니페스트를 배포하기 전에 먼저 만든다:
#   kubectl -n u4-2 create secret generic plant-calc --from-literal=calc-token="$(openssl rand -hex 32)"
# 값을 바꾸면 두 파드를 모두 다시 시작해야 반영된다 (rollout restart deploy/plant-calc deploy/clx-backend).
apiVersion: v1
kind: Secret
metadata:
    name: plant-calc
type: Opaque
stringData:
    calc-token: ""
