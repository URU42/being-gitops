apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
    name: web
    namespace: u4-2
spec:
    ingressClassName: nginx

    tls:
        - hosts:
              - u4-2.skala-us.com
          secretName: team-tls

    rules:
        - host: u4-2.skala-us.com
          http:
              paths:
                  - path: /
                    pathType: Prefix
                    backend:
                        service:
                            name: frontend
                            port:
                                number: 80
