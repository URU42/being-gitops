apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: { name: web }
spec:
    ingressClassName: nginx
    tls: [{ hosts: [u4-2.skala-us.com], secretName: team-tls }]
    rules:
        - host: u4-2.skala-us.com
          http:
              paths:
                  - {
                        path: /api,
                        pathType: Prefix,
                        backend:
                            {
                                service:
                                    { name: backend, port: { number: 8080 } },
                            },
                    }
                  - {
                        path: /,
                        pathType: Prefix,
                        backend:
                            {
                                service:
                                    { name: frontend, port: { number: 80 } },
                            },
                    }
