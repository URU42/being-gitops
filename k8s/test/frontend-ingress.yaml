apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
    name: frontend-ingress
    namespace: u4-2
spec:
    tls:
        - hosts:
              - u4-2.skala-us.com
          secretName: team-tls
    rules:
        - host: u4-2.skala-us.com
          http:
              paths:
                  - path: /
                    pathType: Prefix
                    backend:
                        service:
                            name: frontend
                            port:
                                number: 80
