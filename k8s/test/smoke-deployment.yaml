apiVersion: apps/v1
kind: Deployment
metadata:
    name: harbor-smoke-gitops
spec:
    replicas: 1
    selector:
        matchLabels:
            app: harbor-smoke-gitops
    template:
        metadata:
            labels:
                app: harbor-smoke-gitops
        spec:
            automountServiceAccountToken: false
            imagePullSecrets:
                - name: uru42-harbor-pull
            containers:
                - name: smoke
                  image: harbor.uru42.space/uru42/smoke:test
                  imagePullPolicy: Always
                  command: ["sh", "-c", "sleep 86400"]
                  resources:
                      requests:
                          cpu: 100m
                          memory: 128Mi
                      limits:
                          cpu: 200m
                          memory: 256Mi
