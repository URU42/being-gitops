# main 에 매니페스트가 바뀌면(Jenkins 의 태그 커밋 포함) skala-us u4-2 에 배포한다.
# Jenkins 는 그대로 Harbor 에 push 하고, 여기서 Harbor 이미지를 ECR(teams/u4-2/app:<이름>-<태그>)로 옮겨 apply 한다.
# 필요: 캠퍼스 네트워크의 self-hosted runner(aws, kubectl, docker), repo Secrets HARBOR_USER / HARBOR_PASS (Harbor pull 전용 robot).
# PVC·Secret 은 포털에서 만들므로 apply 하지 않는다. 삭제 권한이 없으므로 prune 하지 않는다.
name: deploy
on:
  push:
    branches: [main]
    paths: ['k8s/overlays/**', 'k8s/plant-sim/**', '.github/workflows/deploy.yml']
  workflow_dispatch:
permissions:
  id-token: write
  contents: read
concurrency:
  group: deploy-u4-2
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      # 로그인 정보를 runner PC 에 남기지 않는다 (RUNNER_TEMP 는 job 마다 비워진다).
      # auths 가 비어 있으면 docker 가 macOS 키체인을 고르는데, launchd 서비스 runner 는 키체인을 못 쓴다 → 더미 항목으로 파일 저장을 강제
      - run: |
          mkdir -p "$RUNNER_TEMP/docker"
          echo '{"auths":{"placeholder.invalid":{}}}' > "$RUNNER_TEMP/docker/config.json"
          echo "DOCKER_CONFIG=$RUNNER_TEMP/docker" >> "$GITHUB_ENV"
          echo "KUBECONFIG=$RUNNER_TEMP/kubeconfig" >> "$GITHUB_ENV"   # runner 계정의 ~/.kube/config 를 건드리지 않는다
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::430986759212:role/gha-u4-2
          aws-region: ap-northeast-2
      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr
      - name: Harbor login
        env:
          HARBOR_USER: ${{ secrets.HARBOR_USER }}
          HARBOR_PASS: ${{ secrets.HARBOR_PASS }}
        run: printf '%s' "$HARBOR_PASS" | docker login harbor.uru42.space -u "$HARBOR_USER" --password-stdin
      - name: Harbor → ECR, apply
        env:
          ECR: ${{ steps.ecr.outputs.registry }}/teams/u4-2/app
        run: |
          set -euo pipefail
          aws eks update-kubeconfig --name skala-us --region ap-northeast-2
          for dir in k8s/overlays k8s/plant-sim; do
            echo "::group::$dir"
            out="$RUNNER_TEMP/$(basename "$dir").yaml"
            kubectl kustomize "$dir" > "$out"
            subst=()
            for img in $(grep -oE 'harbor\.uru42\.space/[^[:space:]"]+' "$out" | sort -u); do
              dst="$ECR:$(basename "${img%:*}")-${img##*:}"   # .../uru42/clx-ai:dev-41-x → app:clx-ai-dev-41-x
              # 이미 ECR 에 있으면 Harbor 에서 받지 않는다 (Harbor 서버 아웃바운드·Cloudflare 트래픽 절약)
              if aws ecr describe-images --repository-name "${ECR#*/}" --image-ids imageTag="${dst##*:}" >/dev/null 2>"$RUNNER_TEMP/ecr.err"; then
                echo "ECR 에 이미 있음: ${dst##*:}"
              else
                grep -q ImageNotFoundException "$RUNNER_TEMP/ecr.err" \
                  || echo "::warning::ECR 태그 확인 실패, Harbor 에서 다시 옮긴다: $(cat "$RUNNER_TEMP/ecr.err")"
                # shortcut: 노드가 amd64 라고 가정하고 amd64 만 옮긴다(runner 맥북은 arm64). arm 노드가 생기면 crane/regctl 로 index 째 복사
                docker pull --platform linux/amd64 "$img"
                docker tag "$img" "$dst"
                docker push --platform linux/amd64 "$dst"
                docker image rm "$img" "$dst" >/dev/null
              fi
              echo "$img -> $dst"
              echo "${dst##*:}" >> "$RUNNER_TEMP/deployed.txt"   # Slack 메시지용
              subst+=(-e "s|$img|$dst|g")
            done
            if [ ${#subst[@]} -gt 0 ]; then sed "${subst[@]}" "$out" > "$out.ecr"; else cp "$out" "$out.ecr"; fi
            if grep -q 'harbor\.uru42\.space' "$out.ecr"; then echo "harbor 이미지가 남았다" >&2; exit 1; fi
            # PVC 는 만들 권한이 없다 (포털 신청). 문서 단위로 걸러낸다
            awk 'BEGIN{RS="\n---\n"; ORS="\n---\n"} !/(^|\n)kind: PersistentVolumeClaim\n/' "$out.ecr" \
              | kubectl apply -f - -o name | tee "$out.applied"
            grep '^deployment' "$out.applied" | while read -r d; do
              kubectl -n u4-2 rollout status "$d" --timeout=10m
            done
            echo "::endgroup::"
          done
      # 사용자가 실제로 들어오는 주소로 확인한다. Ingress whitelist 때문에 캠퍼스 IP 인 runner 에서만 열린다.
      # rollout 이 끝나도 Ingress 반영이 늦을 수 있어 실패하면 5초 간격으로 몇 번 더 본다. (local-ui/server.mjs 의 HEALTH 와 같은 경로)
      - name: Health check
        run: |
          fail=0
          for p in / /api/v1/health /plant-sim/health; do
            for i in 1 2 3 4 5 6; do
              code=$(curl -s -o /dev/null -m 10 -w '%{http_code}' "https://u4-2.skala-us.com$p") || true
              case $code in 2??|3??) break ;; esac
              sleep 5
            done
            echo "$code $p" | tee -a "$RUNNER_TEMP/health.txt"
            case $code in 2??|3??) ;; *) fail=1 ;; esac
          done
          exit $fail
      # repo Secret SLACK_WEBHOOK_URL(Slack Incoming Webhook)이 없으면 건너뛴다. 전송 실패는 배포 결과를 바꾸지 않는다
      - name: Slack
        if: always()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          STATUS: ${{ job.status }}
          EVENT: ${{ github.event_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -n "$SLACK_WEBHOOK_URL" ] || { echo "SLACK_WEBHOOK_URL 없음, 건너뜀"; exit 0; }
          case $STATUS in
            success) icon=':white_check_mark:' word='성공' ;;
            cancelled) icon=':double_vertical_bar:' word='취소' ;;
            *) icon=':x:' word='실패' ;;
          esac
          join() { [ -s "$1" ] && paste -s -d, "$1" | sed 's/,/, /g' || echo '-'; }
          jq -n --arg icon "$icon" --arg word "$word" --arg url "$RUN_URL" --arg event "$EVENT" \
                --arg sha "$(git rev-parse --short HEAD)" --arg subject "$(git log -1 --format='%s (%an)')" \
                --arg images "$(join "$RUNNER_TEMP/deployed.txt")" --arg health "$(join "$RUNNER_TEMP/health.txt")" '
            def esc: gsub("&"; "&amp;") | gsub("<"; "&lt;") | gsub(">"; "&gt;");
            {text: "\($icon) *u4-2 배포 \($word)* · <\($url)|로그>\n커밋 `\($sha)` \($subject | esc) · \($event)\n이미지: \($images)\n헬스체크: \($health)"}' \
            | curl -fsS -m 10 -H 'Content-type: application/json' --data @- "$SLACK_WEBHOOK_URL" >/dev/null \
            || echo "::warning::Slack 전송 실패"
      - if: always()
        run: docker logout harbor.uru42.space || true
